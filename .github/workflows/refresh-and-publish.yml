
name: Update and publish BREAKOUT

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: breakout-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Roblox statistics
        run: python scripts/update_stats.py
      - name: Save new statistics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-data.json game_ids.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update breakout watchlist statistics'
            git push
          fi
      - name: Prepare website
        run: |
          mkdir -p _public
          cp index.html auto-data.json _public/
          touch _public/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
